services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arua
      POSTGRES_PASSWORD: arua_dev
      POSTGRES_DB: arua_backend_development
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arua -d arua_backend_development"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && ./bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://arua:arua_dev@db:5432/arua_backend_development
      RAILS_ENV: development
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    volumes:
      - .:/rails
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
